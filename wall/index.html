<html lang="en">
<head>

<title>CGP Accounting Meeting · Live Wall</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C1A0F;
    --card:#142018;
    --input:#1A2B20;
    --border:#2A3D2E;
    --rule:#22321F;
    --gold:#C9A54E;
    --goldDim:#8B7541;
    --text:#E8E5D8;
    --muted:#8A8878;
    --faint:#5F6459;
    --danger:#FF6B4A;
    --glow:rgba(201,165,78,0.10);
    --ff:"Playfair Display",Georgia,serif;
    --fb:"Source Sans 3",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--fb);-webkit-font-smoothing:antialiased}
  body{min-height:100vh;font-size:16px;line-height:1.5}
  #root{min-height:100vh}
  button{font-family:inherit;color:inherit}
  input,textarea,select{font-family:inherit;font-size:16px}
  a{color:var(--gold)}

  /* app body sits on the same columnar paper as the cover, fainter
     because live content sits on top of it */
  .app{
    min-height:100vh;
    background-image:repeating-linear-gradient(90deg,transparent 0 76px,rgba(42,61,46,.26) 76px 77px);
  }

  .wrap{max-width:760px;margin:0 auto;padding:0 16px 56px}

  /* footing: a double rule under a column, then its total. The double
     rule appears ONLY here and on the cover total. Single hairlines
     divide, double rules foot. */
  .foot{
    display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    margin-top:10px;padding-top:10px;border-top:3px double var(--gold);
  }
  .footK{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--goldDim)}
  .footV{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;text-align:right}

  /* header */
  .hdr{position:sticky;top:0;z-index:40;background:rgba(12,26,15,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .hdrIn{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .brand{font-family:var(--ff);font-weight:700;font-size:17px;letter-spacing:.2px;line-height:1.1}
  .brandSub{font-size:11px;color:var(--goldDim);letter-spacing:2.2px;text-transform:uppercase;font-weight:600}
  .icobtn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:14px;cursor:pointer;color:var(--muted)}
  .icobtn:hover{border-color:var(--gold);color:var(--gold)}

  /* tabs */
  .tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);padding:0 8px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{background:none;border:none;border-bottom:2px solid transparent;padding:11px 12px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--gold);border-bottom-color:var(--gold)}
  .tab .lock{font-size:10px;margin-left:3px}

  /* day pills */
  .days{display:flex;gap:7px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:8px 15px;cursor:pointer;text-align:left;transition:border-color .15s}
  .day:hover{border-color:var(--goldDim)}
  .day .dow{display:block;font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--goldDim);font-variant-numeric:tabular-nums}
  .day .nm{display:block;font-size:15px;font-weight:600;color:var(--text);margin-top:1px}
  .day.on{background:linear-gradient(160deg,#1d3122,#152a1a);border-color:var(--gold)}
  .day.on .dow{color:var(--gold)}
  .day.on .nm{color:#fff}
  .day .now{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--danger);margin-left:5px;vertical-align:middle}

  /* day head */
  .dayhead{padding:22px 0 4px}
  .daytitle{font-family:var(--ff);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.02;letter-spacing:-.4px}
  .daysub{color:var(--muted);margin-top:7px;font-size:15px;max-width:60ch}
  .dayloc{color:var(--goldDim);font-size:13px;margin-top:5px}

  /* weather */
  .wx{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:13px 15px;margin:16px 0}
  .wxIco{font-size:30px;line-height:1;flex:0 0 auto;margin-top:1px}
  .wxHi{font-family:var(--ff);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .wxLo{font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
  .wxCond{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold)}
  .wxPop{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .wxNote{margin-top:5px;font-size:14px;color:var(--text)}
  .wxStamp{margin-top:3px;font-size:11px;color:var(--faint);font-style:italic}
  .wxPend{color:var(--muted);font-size:14px}

  /* attire */
  .attire{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--rule)}
  .attireK{flex:0 0 62px;font-size:10px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold)}
  .attireV{font-size:14px;color:var(--text)}

  /* ledger */
  .ledger{margin-top:18px;border-top:1px solid var(--border)}
  .row{display:flex;gap:14px;padding:14px 2px;border-bottom:1px solid var(--rule);align-items:baseline}
  .row.past{opacity:.42}
  .row.live{background:linear-gradient(90deg,var(--glow),transparent 70%)}
  .rowT{flex:0 0 74px;font-size:13px;font-weight:600;color:var(--goldDim);font-variant-numeric:tabular-nums;letter-spacing:.3px}
  .row.live .rowT{color:var(--gold)}
  .rowB{flex:1;min-width:0}
  .rowTitle{font-size:16px;font-weight:600;line-height:1.35}
  .row.past .rowTitle{text-decoration:line-through;text-decoration-color:var(--faint)}
  .rowMeta{font-size:13px;color:var(--muted);margin-top:2px}
  .liveTag{display:inline-block;margin-left:7px;font-size:9px;font-weight:800;letter-spacing:1.1px;background:var(--danger);color:#fff;padding:2px 5px;border-radius:3px;vertical-align:1px;animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .soon{display:inline-block;margin-left:7px;font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums}
  .detailBtn{background:none;border:none;padding:4px 0 0;font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--goldDim);cursor:pointer}
  .detailBtn:hover{color:var(--gold)}
  .detail{margin-top:7px;font-size:14px;color:var(--muted);line-height:1.55;border-left:1px solid var(--border);padding-left:11px}
  .presenter{font-size:12px;color:var(--goldDim);margin-top:5px}

  /* pending banner */
  .pending{background:var(--input);border:1px dashed var(--goldDim);border-radius:9px;padding:12px 14px;margin:16px 0;font-size:14px;color:var(--muted)}
  .pending b{color:var(--gold);font-weight:600}

  /* generic */
  .sectitle{font-family:var(--ff);font-size:25px;font-weight:700;padding:22px 0 3px}
  .secdesc{color:var(--muted);font-size:15px;padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:15px;margin-bottom:13px}
  .field{width:100%;background:var(--input);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);margin-bottom:8px}
  .field:focus{outline:none;border-color:var(--gold)}
  .btn{background:linear-gradient(160deg,var(--gold),#a8863a);border:none;border-radius:9px;padding:11px 22px;font-weight:700;font-size:15px;color:#12200f;cursor:pointer}
  .btn:disabled{opacity:.45;cursor:default}
  .btnS{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  .btnS:hover{border-color:var(--gold);color:var(--gold)}
  .pill{background:var(--input);border:1px solid var(--border);border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  .pill.on{background:var(--glow);border-color:var(--gold);color:var(--gold)}
  .empty{text-align:center;padding:34px 16px;color:var(--faint);font-style:italic}

  /* q&a */
  .q{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--rule)}
  .vote{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:1px solid var(--border);border-radius:8px;padding:6px 8px;min-width:42px;cursor:pointer;color:var(--muted)}
  .vote:hover{border-color:var(--gold);color:var(--gold)}
  .vote.did{background:var(--glow);border-color:var(--gold);color:var(--gold);cursor:default}
  .voteN{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .qTxt{font-size:16px;line-height:1.45}
  .qMeta{font-size:12px;color:var(--faint);margin-top:4px}
  .qTag{color:var(--goldDim);font-weight:600}
  .ans{opacity:.55}

  /* banner + modal */
  .ann{background:linear-gradient(90deg,#1f3423,#152a1a);border-bottom:1px solid var(--gold);padding:9px 16px;display:flex;gap:10px;align-items:center;justify-content:center;font-size:14px}
  .ovl{position:fixed;inset:0;background:rgba(5,12,7,.82);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:90}
  .modal{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:20px;max-width:440px;width:100%;max-height:86vh;overflow-y:auto}

  /* cover: an entry on columnar ledger paper */
  .hero{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:48px 22px;
    background-image:
      repeating-linear-gradient(90deg,transparent 0 76px,rgba(42,61,46,.5) 76px 77px),
      radial-gradient(ellipse at 50% 20%,#16271b 0%,var(--bg) 72%);
  }
  .heroT{font-family:var(--ff);font-weight:800;font-size:clamp(32px,9vw,52px);line-height:1.03;margin:12px 0 8px}
  .heroSub{color:var(--muted);max-width:34ch;font-size:15px}

  /* the ledger block */
  .led{
    width:100%;max-width:340px;margin:30px 0 4px;text-align:left;
    background:rgba(20,32,24,.72);border:1px solid var(--border);
    border-radius:3px;padding:0 15px 13px;
  }
  .ledHead{
    font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--goldDim);padding:11px 0 8px;border-bottom:1px solid var(--border);
  }
  .led dl{margin:0}
  .ledRow{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--rule)}
  .ledRow dt{font-size:14px;color:var(--text)}
  .ledRow dd{margin:0;font-family:var(--ff);font-size:21px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
  /* single rule is a subtotal, double rule is the total. Accounting
     notation, used here for what it actually means. */
  .ledTotal{
    display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    margin-top:9px;padding-top:9px;border-top:3px double var(--gold);
  }
  .ledTotal .k{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--goldDim)}
  .ledTotal .v{font-size:14px;font-weight:600;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}


  /* 3D field of formulas and terms. Real depth via CSS perspective:
     each item flies from far negative Z toward the viewer, so
     perspective handles the scaling and parallax. Decorative only,
     so aria-hidden and pointer-events:none. Removed under reduced
     motion rather than frozen mid-flight. */
  .floats{
    position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
    perspective:700px;perspective-origin:50% 46%;
  }
  .fl{
    position:absolute;left:50%;top:50%;white-space:nowrap;opacity:0;
    animation-name:fly;animation-timing-function:linear;
    animation-iteration-count:infinite;will-change:transform,opacity;
  }
  .fl.f{font-family:"Courier New",monospace;color:var(--goldDim)}
  .fl.t{font-family:var(--fb);font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#33482F}
  @keyframes fly{
    0%   {transform:translate3d(var(--x),var(--y),-1500px) rotateY(var(--ry)) rotateX(var(--rx));opacity:0}
    12%  {opacity:.52}
    72%  {opacity:.42}
    100% {transform:translate3d(var(--x),var(--y),300px) rotateY(var(--ry)) rotateX(var(--rx));opacity:0}
  }
  .hero{position:relative}
  .heroIn{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%}
  @media (prefers-reduced-motion:reduce){ .floats{display:none} }

  .qr{background:#fff;padding:11px;border-radius:12px;margin:22px 0 10px}
  .qr img{display:block;width:168px;height:168px}

  .dm .rowTitle{font-size:21px}
  .dm .rowT{font-size:16px;flex-basis:92px}
  .dm .daytitle{font-size:clamp(34px,8vw,52px)}
  .dm .qTxt{font-size:21px}

  @media (max-width:420px){
    .rowT{flex-basis:62px;font-size:12px}
    .attireK{flex-basis:54px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
<!-- Every version below is pinned on purpose. Do not float them.
     Babel must stay on 7.x. In Babel 8 the react preset defaults to the
     automatic JSX runtime, which emits `import { jsx } from
     "react/jsx-runtime"`. That cannot resolve in a plain browser script
     and the whole page dies with a blank screen. 7.x defaults to the

const USE_FIREBASE =

  FIREBASE_CONFIG.databaseURL.indexOf("PASTE") === -1;

/* ============================================================
   DATA LAYER
   One interface, two backends. Firebase when reachable,
   localStorage otherwise. Components only ever touch store
   and useNode. Every node is namespaced under EVENT.id.
   ============================================================ */
const store = (() => {
  const PREFIX = EVENT.id + "_db_";
  const subs = {};
  const cache = {};
  const loaded = {};
  const pushKey = () =>
    "k" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const notify = node => {
    if (subs[node]) subs[node].forEach(cb => cb(cache[node] || {}));
  };

  if (USE_FIREBASE) {
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    const ref = node => db.ref(EVENT.id + "/" + node);
    const attached = {};
    const ensure = node => {
      if (attached[node]) return;
      attached[node] = true;
      ref(node).on("value", snap => {
        cache[node] = snap.val() || {};
        loaded[node] = true;
        notify(node);
      });
    };
    return {
      live: true,
      list(node) {
        ensure(node);
        const o = cache[node] || {};
        return Object.keys(o)
          .map(k => ({ ...o[k], _key: k }))
          .sort((a, b) => (a.ts || 0) - (b.ts || 0));
      },
      object(node) { ensure(node); return cache[node] || {}; },
      isLoaded(node) { return !!loaded[node]; },
      push(node, entry) {
        ensure(node);
        const r = ref(node).push();
        r.set({ ...entry, ts: entry.ts || firebase.database.ServerValue.TIMESTAMP });
        return r.key;
      },
      update(node, key, patch) { ref(node).child(key).update(patch); },
      remove(node, key) { ref(node).child(key).remove(); },
      setNode(node, value) { ref(node).set(value || {}); },
      clearNode(node) { ref(node).remove(); },
      subscribe(node, cb) {
        ensure(node);
        if (!subs[node]) subs[node] = new Set();
        subs[node].add(cb);
        cb(cache[node] || {});
        return () => subs[node].delete(cb);
      }
    };
  }

  const read = node => {
    try { return JSON.parse(localStorage.getItem(PREFIX + node) || "{}"); }
    catch (e) { return {}; }
  };
  const write = (node, obj) => {
    localStorage.setItem(PREFIX + node, JSON.stringify(obj));
    cache[node] = obj;
    notify(node);
  };
  return {
    live: false,
    list(node) {
      const o = read(node);
      return Object.keys(o)
        .map(k => ({ ...o[k], _key: k }))
        .sort((a, b) => (a.ts || 0) - (b.ts || 0));
    },
    object(node) { return read(node); },
    isLoaded() { return true; },
    push(node, entry) {
      const o = read(node);
      const k = pushKey();
      o[k] = { ...entry, ts: entry.ts || Date.now() };
      write(node, o);
      return k;
    },
    update(node, key, patch) {
      const o = read(node);
      o[key] = { ...(o[key] || {}), ...patch };
      write(node, o);
    },
    remove(node, key) { const o = read(node); delete o[key]; write(node, o); },
    setNode(node, value) { write(node, value || {}); },
    clearNode(node) { write(node, {}); },
    subscribe(node, cb) {
      if (!subs[node]) subs[node] = new Set();
      subs[node].add(cb);
      cb(read(node));
      return () => subs[node].delete(cb);
    }
  };
})();

function useNode(node) {
  const [obj, setObj] = useState({});
  useEffect(() => store.subscribe(node, setObj), [node]);
  const list = useMemo(
    () => Object.keys(obj)
      .map(k => ({ ...obj[k], _key: k }))
      .sort((a, b) => (a.ts || 0) - (b.ts || 0)),
    [obj]
  );
  return [list, obj];
}

const local = {
  get(key, fallback) {
    try {
      const v = localStorage.getItem(EVENT.id + "_" + key);
      return v ? JSON.parse(v) : fallback;
    } catch (e) { return fallback; }
  },
  set(key, val) {
    try { localStorage.setItem(EVENT.id + "_" + key, JSON.stringify(val)); }
    catch (e) {}
  },
  clearAll() {
    Object.keys(localStorage)
      .filter(k => k.startsWith(EVENT.id + "_") && !k.startsWith(EVENT.id + "_db_"))
      .forEach(k => localStorage.removeItem(k));
  }
};

/* ============================================================
   HELPERS
   ============================================================ */
const ago = ts => {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + "s ago";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  return Math.floor(h / 24) + "d ago";
};

const at = (date, hhmm) => new Date(date + "T" + hhmm + ":00-05:00");

const f12 = hhmm => {
  const [h, m] = hhmm.split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM";
  const hr = h % 12 === 0 ? 12 : h % 12;
  return hr + ":" + String(m).padStart(2, "0") + " " + ap;
};

const todayISO = () => {
  const d = new Date(new Date().toLocaleString("en-US", { timeZone: EVENT.tz }));
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
};

/* ============================================================
   WEATHER
   ------------------------------------------------------------
   Open-Meteo. No API key, which matters: this is a public repo
   on GitHub Pages, so any key committed here would be public.
   Open-Meteo forecasts 16 days out, which reaches the meeting.

   Flow: fetch once, cache to Firebase under acct26/weather,
   render from the cache. Every device then shows identical
   numbers, and a failed fetch on venue wifi falls back to the
   last good values instead of a broken card.
   ============================================================ */
const WMO = {
  0:  ["Clear",           "\u2600\uFE0F"],
  1:  ["Mostly clear",    "\uD83C\uDF24\uFE0F"],
  2:  ["Partly cloudy",   "\u26C5"],
  3:  ["Overcast",        "\u2601\uFE0F"],
  45: ["Fog",             "\uD83C\uDF2B\uFE0F"],
  48: ["Freezing fog",    "\uD83C\uDF2B\uFE0F"],
  51: ["Light drizzle",   "\uD83C\uDF26\uFE0F"],
  53: ["Drizzle",         "\uD83C\uDF26\uFE0F"],
  55: ["Heavy drizzle",   "\uD83C\uDF26\uFE0F"],
  61: ["Light rain",      "\uD83C\uDF27\uFE0F"],
  63: ["Rain",            "\uD83C\uDF27\uFE0F"],
  65: ["Heavy rain",      "\uD83C\uDF27\uFE0F"],
  71: ["Light snow",      "\u2744\uFE0F"],
  73: ["Snow",            "\u2744\uFE0F"],
  75: ["Heavy snow",      "\u2744\uFE0F"],
  80: ["Light showers",   "\uD83C\uDF26\uFE0F"],
  81: ["Showers",         "\uD83C\uDF27\uFE0F"],
  82: ["Heavy showers",   "\uD83C\uDF27\uFE0F"],
  95: ["Thunderstorms",   "\u26C8\uFE0F"],
  96: ["Storms with hail","\u26C8\uFE0F"],
  99: ["Severe storms",   "\u26C8\uFE0F"]
};
const wmo = c => WMO[c] || ["Forecast", "\uD83C\uDF21\uFE0F"];

const REFRESH_AFTER = 6 * 60 * 60 * 1000; // 6 hours

function useWeather(isAdmin) {
  const [, wx] = useNode("weather");
  const busy = useRef(false);

  const fetchNow = useCallback(async () => {
    if (busy.current) return;
    busy.current = true;
    try {
      // Open-Meteo forecasts today plus 15 days. Asking for a date past
      // that can 400 the whole request, which would drop the forecast for
      // every day rather than just the far one. So clamp the end date and
      // let any day beyond it fall back on its own.
      const HORIZON = 15;
      const cap = new Date(Date.now() + HORIZON * 86400000)
        .toISOString().slice(0, 10);
      const first = AGENDA[0].date;
      const wanted = AGENDA[AGENDA.length - 1].date;
      const last = wanted > cap ? cap : wanted;
      if (last < first) {
        // Whole meeting is still beyond the horizon. Nothing to fetch yet.
        busy.current = false;
        return;
      }
      const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + VENUE.lat +
        "&longitude=" + VENUE.lon +
        "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code" +
        "&temperature_unit=fahrenheit" +
        "&timezone=" + encodeURIComponent(EVENT.tz) +
        "&start_date=" + first +
        "&end_date=" + last;
      const res = await fetch(url);
      if (!res.ok) throw new Error("weather " + res.status);
      const j = await res.json();
      const d = j.daily;
      if (!d || !d.time) throw new Error("weather shape");
      const days = {};
      d.time.forEach((iso, i) => {
        days[iso.replace(/-/g, "")] = {
          hi: Math.round(d.temperature_2m_max[i]),
          lo: Math.round(d.temperature_2m_min[i]),
          pop: d.precipitation_probability_max[i] ?? null,
          code: d.weather_code[i]
        };
      });
      store.setNode("weather", { days, fetchedAt: Date.now() });
    } catch (e) {
      // Silent. A missing forecast shows a quiet pending line,
      // never a broken card and never a console-spewing retry loop.
      console.warn("Forecast unavailable:", e.message);
    } finally {
      busy.current = false;
    }
  }, []);

  useEffect(() => {
    if (!store.isLoaded("weather")) return;
    const age = Date.now() - (wx.fetchedAt || 0);
    if (!wx.fetchedAt || age > REFRESH_AFTER) fetchNow();
  }, [wx.fetchedAt, fetchNow]);

  const forDay = iso => (wx.days || {})[iso.replace(/-/g, "")] || null;
  return { forDay, fetchedAt: wx.fetchedAt || null, refresh: fetchNow };
}

function Weather({ day, wx }) {
  const d = wx.forDay(day.date);
  if (!d) {
    return (
      <div className="wx">
        <div className="wxIco">{"\uD83C\uDF21\uFE0F"}</div>
        <div>
          <div className="wxPend">Forecast appears closer to the date.</div>
        </div>
      </div>
    );
  }
  const [cond, ico] = wmo(d.code);
  const stamp = wx.fetchedAt
    ? new Date(wx.fetchedAt).toLocaleDateString("en-US", { month: "short", day: "numeric" })
    : null;
  return (
    <div className="wx">
      <div className="wxIco">{ico}</div>
      <div style={{ minWidth: 0 }}>
        <div style={{ display: "flex", gap: 9, alignItems: "baseline", flexWrap: "wrap" }}>
          <span className="wxHi">{d.hi}&deg;</span>
          <span className="wxLo">{d.lo}&deg;</span>
          <span className="wxCond">{cond}</span>
          {d.pop != null && (
            <span className="wxPop">{"\uD83D\uDCA7"} {d.pop}%</span>
          )}
        </div>
        {stamp && <div className="wxStamp">Forecast as of {stamp}.</div>}
      </div>
    </div>
  );
}

   AGENDA TAB
   ============================================================ */
function AgendaTab({ dm, isAdmin }) {
  const [now, setNow] = useState(new Date());
  const [openRow, setOpenRow] = useState(null);
  const wx = useWeather(isAdmin);

  const [dayNo, setDayNo] = useState(() => {
    const t = todayISO();
    const hit = AGENDA.find(d => d.date === t) ||
                AGENDA.find(d => d.date > t) ||
                AGENDA[0];
    return hit.day;
  });

  useEffect(() => {
    const iv = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(iv);
  }, []);

  const d = AGENDA.find(x => x.day === dayNo) || AGENDA[0];
  const t = todayISO();

  return (
    <div className="wrap">
      <div className="days">
        {AGENDA.map(x => (
          <button
            key={x.day}
            className={"day" + (x.day === dayNo ? " on" : "")}
            onClick={() => { setDayNo(x.day); setOpenRow(null); }}
            aria-pressed={x.day === dayNo}
          >
            <span className="dow">
              {x.dow}
              {x.date === t && <span className="now" />}
            </span>
            <span className="nm">{x.nm}</span>
          </button>
        ))}
      </div>

      <div className="dayhead">
        <h1 className="daytitle">{d.title}</h1>
        {d.sub && <p className="daysub">{d.sub}</p>}
        {d.loc && <p className="dayloc">{d.loc}</p>}
      </div>

      <Weather day={d} wx={wx} />

      {d.attire && (
        <div className="attire">
          <span className="attireK">Attire</span>
          <span className="attireV">{d.attire}</span>
        </div>
      )}

      {d.pending && (
        <div className="pending">
          <b>Agenda pending.</b> Times and sessions below are placeholders.
          Day tabs, forecast, and live tracking are working. Real sessions
          drop straight in.
        </div>
      )}

      <div className="ledger">
        {d.ev.map((e, i) => {
          const s = at(d.date, e.t);
          const en = at(d.date, e.e);
          const live = now >= s && now < en;
          const past = now >= en;
          const mins = Math.round((s - now) / 60000);
          const soon = !live && !past && mins > 0 && mins <= 45;
          const key = d.day + "-" + i;
          const open = openRow === key;
          return (
            <div key={i} className={"row" + (past ? " past" : "") + (live ? " live" : "")}>
              <div className="rowT">{f12(e.t)}</div>
              <div className="rowB">
                <div className="rowTitle">
                  {e.title}
                  {live && <span className="liveTag">NOW</span>}
                  {soon && <span className="soon">in {mins}m</span>}
                </div>
                {e.kind && <div className="rowMeta">{e.kind}</div>}
                {(e.detail || (isAdmin && e.presenter)) && (
                  <button
                    className="detailBtn"
                    onClick={() => setOpenRow(open ? null : key)}
                    aria-expanded={open}
                  >
                    {open ? "Hide detail" : "Detail"}
                  </button>
                )}
                {open && (
                  <div className="detail">
                    {e.detail}
                    {isAdmin && e.presenter && (
                      <div className="presenter">Presenting: {e.presenter}</div>
                    )}
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {d.ev.length > 0 && (
        <div className="foot">
          <span className="footK">
            {d.ev.length} session{d.ev.length === 1 ? "" : "s"}
          </span>
          <span className="footV">
            {f12(d.ev[0].t)} to {f12(d.ev[d.ev.length - 1].e)}
          </span>
        </div>
      )}

      {isAdmin && (
        <div style={{ marginTop: 18 }}>
          <button className="btnS" onClick={wx.refresh}>Refresh forecast</button>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   Q&A TAB
   Behaviour preserved from the live teaser. Converted to JSX.
   ============================================================ */
const QA_CATS = ["All", "Tax", "GAAP", "Audit", "Operations", "Systems", "Other"];

function QATab({ dm, isAdmin }) {
  const [list] = useNode("questions");
  const [name, setName] = useState("");
  const [text, setText] = useState("");
  const [cat, setCat] = useState("Other");
  const [anon, setAnon] = useState(false);
  const [sort, setSort] = useState("top");
  const [filter, setFilter] = useState("All");
  const [voted, setVoted] = useState({});

  useEffect(() => {
    const m = {};
    list.forEach(q => { if (local.get("qvote_" + q._key, false)) m[q._key] = true; });
    setVoted(m);
  }, [list.length]);

  const submit = () => {
    if (!text.trim()) return;
    store.push("questions", {
      name: anon ? "" : name.trim(),
      anon,
      text: text.trim(),
      cat,
      votes: 0,
      answered: false
    });
    setText("");
  };

  const upvote = q => {
    if (voted[q._key]) return;
    store.update("questions", q._key, { votes: (q.votes || 0) + 1 });
    local.set("qvote_" + q._key, true);
    setVoted(v => ({ ...v, [q._key]: true }));
  };

  // Export every question, including ones submitted before the full
  // wall shipped. Gives a portable copy of attendee input that does
  // not depend on the database staying up.
  const exportCSV = () => {
    const esc = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const head = ["Submitted", "Category", "Name", "Anonymous", "Votes", "Answered", "Question"];
    const body = live
      .slice()
      .sort((a, b) => (a.ts || 0) - (b.ts || 0))
      .map(q => [
        q.ts ? new Date(q.ts).toLocaleString() : "",
        q.cat || "Other",
        q.anon ? "" : (q.name || ""),
        q.anon ? "yes" : "no",
        q.votes || 0,
        q.answered ? "yes" : "no",
        q.text
      ].map(esc).join(","));
    const csv = [head.map(esc).join(","), ...body].join("\r\n");
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = "acct26-questions-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // Skip anything with no question text. Guards against a malformed or
  // half-written record breaking the whole list.
  const live = list.filter(q => q.text && String(q.text).trim());

  let rows = live.filter(q => filter === "All" || (q.cat || "Other") === filter);
  rows = rows.sort((a, b) =>
    sort === "top" ? (b.votes || 0) - (a.votes || 0) : (b.ts || 0) - (a.ts || 0)
  );
  rows = rows.sort((a, b) => (a.answered ? 1 : 0) - (b.answered ? 1 : 0));

  return (
    <div className="wrap">
      <h2 className="sectitle">Questions</h2>
      <p className="secdesc">
        Ask the room. Upvote what you want answered.
        {live.length > 0 && (
          <span style={{ color: "var(--goldDim)" }}>
            {" "}{live.length} submitted so far.
          </span>
        )}
      </p>

      {isAdmin && live.length > 0 && (
        <div style={{ marginBottom: 13 }}>
          <button className="btnS" onClick={exportCSV}>
            Export {live.length} questions to CSV
          </button>
        </div>
      )}

      {!dm && (
        <div className="card">
          <input
            className="field"
            placeholder="Your name (optional)"
            value={name}
            onChange={e => setName(e.target.value)}
            disabled={anon}
          />
          <textarea
            className="field"
            rows={3}
            style={{ resize: "vertical" }}
            placeholder="Your question"
            value={text}
            onChange={e => setText(e.target.value)}
          />
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            <select className="field" style={{ width: "auto", marginBottom: 0 }}
              value={cat} onChange={e => setCat(e.target.value)}>
              {QA_CATS.filter(c => c !== "All").map(c => <option key={c}>{c}</option>)}
            </select>
            <label style={{ display: "flex", gap: 6, alignItems: "center", fontSize: 14, color: "var(--muted)" }}>
              <input type="checkbox" checked={anon} onChange={e => setAnon(e.target.checked)} />
              Ask anonymously
            </label>
            <button className="btn" style={{ marginLeft: "auto" }}
              onClick={submit} disabled={!text.trim()}>Post question</button>
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", paddingBottom: 12 }}>
        <button className={"pill" + (sort === "top" ? " on" : "")} onClick={() => setSort("top")}>Top</button>
        <button className={"pill" + (sort === "new" ? " on" : "")} onClick={() => setSort("new")}>New</button>
        <span style={{ width: 8 }} />
        {QA_CATS.map(c => (
          <button key={c} className={"pill" + (filter === c ? " on" : "")}
            onClick={() => setFilter(c)}>{c}</button>
        ))}
      </div>

      {rows.length === 0 && <p className="empty">No questions yet. Ask the first one.</p>}

      {rows.map(q => (
        <div key={q._key} className={"q" + (q.answered ? " ans" : "")}>
          <button
            className={"vote" + (voted[q._key] ? " did" : "")}
            onClick={() => upvote(q)}
            aria-label="Upvote"
          >
            <span style={{ fontSize: 13 }}>{voted[q._key] ? "\u2713" : "\u25B2"}</span>
            <span className="voteN">{q.votes || 0}</span>
          </button>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div className="qTxt">{q.text}</div>
            <div className="qMeta">
              <span className="qTag">{q.cat || "Other"}</span>
              {" · "}
              {q.anon || !q.name ? "Anonymous" : q.name}
              {q.ts ? " · " + ago(q.ts) : ""}
              {q.answered ? " · answered" : ""}
            </div>
            {isAdmin && (
              <div style={{ display: "flex", gap: 6, marginTop: 7 }}>
                <button className="btnS"
                  onClick={() => store.update("questions", q._key, { answered: !q.answered })}>
                  {q.answered ? "Mark unanswered" : "Mark answered"}
                </button>
                <button className="btnS" style={{ borderColor: "var(--danger)", color: "var(--danger)" }}
                  onClick={() => {
                    if (window.confirm("Delete this question?")) store.remove("questions", q._key);
                  }}>Delete</button>
              </div>
            )}
          </div>
        </div>
      ))}

      {rows.length > 0 && (
        <div className="foot">
          <span className="footK">
            {rows.length} question{rows.length === 1 ? "" : "s"}
            {filter !== "All" ? " in " + filter : ""}
          </span>
          <span className="footV">
            {rows.reduce((n, q) => n + (q.votes || 0), 0)} votes cast
          </span>
        </div>
      )}
    </div>
  );
}

      <button className="btnS" onClick={() => {
        const n = hid.concat([a._key]);
        setHid(n); local.set("annHidden", n);
      }}>Dismiss</button>
    </div>
  );
}

function AdminModal({ onClose }) {
  const [txt, setTxt] = useState("");
  const [list] = useNode("announcements");
  const [qs] = useNode("questions");
  const live = list.filter(a => a.on);
  const qCount = qs.filter(q => q.text && String(q.text).trim()).length;

  // Questions hold real attendee input, some of it submitted weeks
  // before the meeting. A single mistap must not be able to destroy
  // it, so that reset asks for a typed word and states the count.
  const wipeQuestions = () => {
    const n = qCount;
    const answer = window.prompt(
      "This deletes all " + n + " question" + (n === 1 ? "" : "s") +
      " for everyone, including any submitted before the meeting.\n\n" +
      "There is no undo. Export first if you have not.\n\n" +
      "Type DELETE to confirm."
    );
    if (answer === "DELETE") store.clearNode("questions");
    else if (answer !== null) window.alert("Not deleted.");
  };

  const SAFE_NODES = [
    ["announcements", "Announcements"],
    ["weather", "Forecast cache"]
  ];
  return (
    <div className="ovl" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h2 style={{ fontFamily: "var(--ff)", fontSize: 21, color: "var(--gold)" }}>Admin</h2>
          <button className="btnS" onClick={onClose}>Close</button>
        </div>

        <p style={{ fontSize: 13, color: "var(--muted)", marginBottom: 6 }}>
          Data layer: {store.live ? "Firebase, live and shared" : "local only, not shared"}
        </p>

        <h3 style={{ fontSize: 14, color: "var(--goldDim)", margin: "14px 0 6px" }}>Post an announcement</h3>
        <input className="field" placeholder="Message to everyone" value={txt}
          onChange={e => setTxt(e.target.value)} />
        <button className="btn" disabled={!txt.trim()} onClick={() => {
          store.push("announcements", { text: txt.trim(), on: true });
          setTxt("");
        }}>Post</button>

        {live.map(a => (
          <div key={a._key} style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8, fontSize: 14 }}>
            <span style={{ flex: 1 }}>{a.text}</span>
            <button className="btnS" onClick={() => store.update("announcements", a._key, { on: false })}>Retire</button>
          </div>
        ))}

        <h3 style={{ fontSize: 14, color: "var(--goldDim)", margin: "20px 0 6px" }}>Reset a section</h3>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {SAFE_NODES.map(([node, label]) => (
            <button key={node} className="btnS"
              style={{ borderColor: "var(--danger)", color: "var(--danger)" }}
              onClick={() => {
                if (window.confirm("Clear all " + label + "? This cannot be undone.")) {
                  store.clearNode(node);
                }
              }}>{label}</button>
          ))}
        </div>

        <div style={{ marginTop: 14, padding: 12, border: "1px solid var(--danger)", borderRadius: 9 }}>
          <div style={{ fontSize: 13, color: "var(--text)", marginBottom: 3 }}>
            {qCount} question{qCount === 1 ? "" : "s"} on file
          </div>
          <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 9 }}>
            Includes anything submitted ahead of the meeting. Export from the
            Questions tab before you touch this.
          </div>
          <button className="btnS"
            style={{ borderColor: "var(--danger)", color: "var(--danger)" }}
            onClick={wipeQuestions}>Delete all questions</button>
        </div>

        <h3 style={{ fontSize: 14, color: "var(--goldDim)", margin: "20px 0 6px" }}>This device</h3>
        <button className="btnS" onClick={() => {
          local.clearAll();
          window.alert("Local votes cleared. Reload to see the effect.");
        }}>Clear my votes</button>
      </div>
    </div>
  );
}


/* ============================================================
   DRIFTING MARGINALIA
   Excel formulas and accounting terms, per John's note. Positions
   and timings are computed once on mount so they stay put across
   re-renders instead of jumping every tick.
   ============================================================ */
const FORMULAS = [
  "=SUM(B2:B13)",
  "=SUMIFS(Amount,Dept,\"F&B\",Month,\"Sep\")",
  "=VLOOKUP(A2,Chart!A:C,3,FALSE)",
  "=XLOOKUP(A2,Accounts,Balance)",
  "=INDEX(Balance,MATCH(A2,Account,0))",
  "=IFERROR(B2/C2,0)",
  "=(B2-C2)/C2",
  "=SUBTOTAL(9,B2:B99)",
  "=EOMONTH(TODAY(),0)",
  "=NPV(0.08,C2:C13)",
  "=IRR(D2:D13)",
  "=SLN(50000,5000,7)",
  "=ROUND(B2*C2,2)",
  "=TEXT(B2,\"$#,##0.00\")",
  "=SUM(Revenue)-SUM(COGS)"
];
const TERMS = [
  "GAAP", "Assets", "Liabilities", "Accrual", "Balance Sheet",
  "Income Statement", "Gross Margin", "COGS", "EBITDA"
];

function Floats() {
  const items = useMemo(() => {
    const pool = [];
    FORMULAS.forEach(v => pool.push({ v, k: "f" }));
    TERMS.forEach(v => pool.push({ v, k: "t" }));
    const n = pool.length;
    return pool.map((it, i) => {
      // Two different hashes so x and y do not correlate into stripes.
      const j1 = ((i * 2654435761) % 1000) / 1000;
      const j2 = ((i * 40503 + 12345) % 1000) / 1000;
      const dur = 19 + Math.round(j1 * 15);
      return {
        ...it,
        x: Math.round((j1 - 0.5) * 840),
        y: Math.round((j2 - 0.5) * 680),
        ry: Math.round((j1 - 0.5) * 46),
        rx: Math.round((j2 - 0.5) * 22),
        size: it.k === "f" ? 15 + Math.round(j1 * 6) : 12 + Math.round(j2 * 4),
        dur,
        // Negative delays so the field is already populated at load
        // instead of every item starting from the far plane together.
        delay: -Math.round((i / n) * dur * 1.7)
      };
    });
  }, []);

  return (
    <div className="floats" aria-hidden="true">
      {items.map((it, i) => (
        <span
          key={i}
          className={"fl " + it.k}
          style={{
            fontSize: it.size,
            animationDuration: it.dur + "s",
            animationDelay: it.delay + "s",
            "--x": it.x + "px",
            "--y": it.y + "px",
            "--ry": it.ry + "deg",
            "--rx": it.rx + "deg"
          }}
        >{it.v}</span>
      ))}
    </div>
  );
}

function Welcome({ onEnter }) {
  const [left, setLeft] = useState(undefined);
  useEffect(() => {
    const tick = () => {
      const ms = new Date(EVENT.startISO) - new Date();
      if (ms <= 0) return setLeft(null);
      setLeft({
        d: Math.floor(ms / 86400000),
        h: Math.floor(ms / 3600000) % 24,
        m: Math.floor(ms / 60000) % 60
      });
    };
    tick();
    const iv = setInterval(tick, 30000);
    return () => clearInterval(iv);
  }, []);

  const starts = new Date(EVENT.startISO).toLocaleString("en-US", {
    timeZone: EVENT.tz, weekday: "short", month: "short",
    day: "numeric", hour: "numeric", minute: "2-digit"
  });

  const pad = n => String(n).padStart(2, "0");

  return (
    <div className="hero">
      <Floats />
      <div className="heroIn">
      <div className="brandSub">Century Golf Partners</div>
      <h1 className="heroT">Accounting Meeting</h1>
      <p className="heroSub">
        Agenda, forecast, and questions for the week. Everything in one place.
      </p>

      <div className="led">
        <div className="ledHead">Time to first session</div>
        {left === undefined && (
          <div className="ledRow"><dt>Loading</dt><dd>&ndash;&ndash;</dd></div>
        )}
        {left && (
          <dl>
            <div className="ledRow"><dt>Days</dt><dd>{pad(left.d)}</dd></div>
            <div className="ledRow"><dt>Hours</dt><dd>{pad(left.h)}</dd></div>
            <div className="ledRow"><dt>Minutes</dt><dd>{pad(left.m)}</dd></div>
          </dl>
        )}
        {left === null && (
          <dl>
            <div className="ledRow"><dt>Status</dt><dd>Open</dd></div>
          </dl>
        )}
        <div className="ledTotal">
          <span className="k">{left === null ? "Underway" : "Opens"}</span>
          <span className="v">{starts} CT</span>
        </div>
      </div>

      <button className="btn" style={{ marginTop: 26, padding: "14px 34px", fontSize: 17 }}
        onClick={onEnter}>Open the wall</button>
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState(() => local.get("entered", false) ? "main" : "welcome");
  const [tab, setTab] = useState("agenda");
  const [dm, setDm] = useState(false);
  const [isAdmin, setIsAdmin] = useState(false);
  const [askPin, setAskPin] = useState(false);
  const [pin, setPin] = useState("");
  const [showAdmin, setShowAdmin] = useState(false);

  const enter = () => { local.set("entered", true); setScreen("main"); };
  const backToCover = () => setScreen("welcome");

  const tryPin = () => {
    if (pin === EVENT.pin) { setIsAdmin(true); setAskPin(false); setPin(""); }
    else setPin("");
  };

  if (screen === "welcome") return <Welcome onEnter={enter} />;

  const TABS = [
    { id: "agenda", label: "Agenda" },
    { id: "questions", label: "Questions" }
  ];

  return (
    <div className={"app" + (dm ? " dm" : "")}>
      <AnnBanner />
      <header className="hdr">
        <div className="hdrIn">
          <button className="icobtn" onClick={backToCover}
            title="Back to the countdown" aria-label="Back to the countdown">&#8592;</button>
          <div style={{ flex: 1, minWidth: 0 }}><Logo /></div>
          <button className="icobtn" onClick={() => setDm(v => !v)}
            title="Bigger text for projection">{dm ? "Aa" : "aA"}</button>
          <button className="icobtn"
            onClick={() => isAdmin ? setShowAdmin(true) : setAskPin(true)}
            title="Admin">{isAdmin ? "\u2699" : "\u25CB"}</button>
        </div>
        <div className="tabs">
          {TABS.map(t => (
            <button key={t.id} className={"tab" + (tab === t.id ? " on" : "")}
              onClick={() => setTab(t.id)}>{t.label}</button>
          ))}
        </div>
      </header>

      {tab === "agenda" && <AgendaTab dm={dm} isAdmin={isAdmin} />}
      {tab === "questions" && <QATab dm={dm} isAdmin={isAdmin} />}

      {askPin && (
        <div className="ovl" onClick={() => setAskPin(false)}>
          <div className="modal" style={{ maxWidth: 300, textAlign: "center" }}
            onClick={e => e.stopPropagation()}>
            <h2 style={{ fontFamily: "var(--ff)", fontSize: 19, marginBottom: 12 }}>Admin</h2>
            <input className="field" type="password" inputMode="numeric"
              style={{ textAlign: "center", fontSize: 20, letterSpacing: 5 }}
              placeholder="PIN" value={pin}
              onChange={e => setPin(e.target.value)}
              onKeyDown={e => e.key === "Enter" && tryPin()} autoFocus />
            <button className="btn" style={{ width: "100%" }} onClick={tryPin}>Unlock</button>
          </div>
        </div>
      )}

      {showAdmin && <AdminModal onClose={() => setShowAdmin(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
